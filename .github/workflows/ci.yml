name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: cexy-mcp}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {path: cexy-mcp, fetch-depth: 0}
      # Prerelease only: the SDK is consumed from a sibling checkout ("file:../cexy-typescript").
      # Released versions pin the published @cexyio/cexy instead, and this step goes away.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {repository: cexyio/cexy-typescript, path: cexy-typescript}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22}
      - name: Build the SDK dependency
        working-directory: cexy-typescript
        run: npm ci && npm run build
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Tests (offline)
        run: npm test
      - name: Build
        run: npm run build
      - name: Package contents
        run: npm pack --dry-run
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
      - name: No internal references
        env:
          SCAN_PATTERNS: ${{ secrets.SCAN_PATTERNS }}
        run: |
          printf '%s\n' "$SCAN_PATTERNS" > "$RUNNER_TEMP/scan-patterns.txt"
          CEXY_SCAN_PATTERNS_FILE="$RUNNER_TEMP/scan-patterns.txt" python3 tools/scan_internal.py .
      - name: Secret scan (gitleaks 8.21.2, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --no-banner --redact
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --no-banner --redact

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    defaults:
      run: {working-directory: cexy-mcp}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {path: cexy-mcp}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {repository: cexyio/cexy-typescript, path: cexy-typescript}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: "${{ matrix.node }}"}
      - name: Build the SDK dependency
        working-directory: cexy-typescript
        run: npm ci && npm run build
      - run: npm ci
      - run: npm test
      - name: The bin starts and answers initialize over stdio
        run: |
          npm run build
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 10 node dist/cli.js | grep -q '"serverInfo"'
