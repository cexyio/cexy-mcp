name: publish
# Publishes to npm when a version tag on main is pushed, using npm trusted publishing (OIDC)
# with provenance. No NPM_TOKEN or other long-lived secret is used: configure this repository
# and workflow as a trusted publisher for @cexyio/mcp on npmjs.com.
#
# Two jobs: `build` (no OIDC token) installs, checks, tests and packs; `publish` (environment
# "npm", id-token: write) only downloads the tarball and publishes it.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
env:
  # One definition of the publish command, used verbatim by the build job's dry run and by the
  # publish job, both from $GITHUB_WORKSPACE with the tarball in ./pkg. PUBLISH_ARGS is expanded
  # unquoted on purpose (word splitting and the glob). "./" matters: npm reads "pkg/x.tgz" as
  # a GitHub user/repo shorthand, not a file.
  NPM_CLI: npm@11.6.2
  PUBLISH_ARGS: ./pkg/*.tgz --access public --ignore-scripts

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      dist_tag: ${{ steps.pack.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 22}
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: "The SDK dependency is a published version (no file:/link: specifiers)"
        run: |
          node -e '
            const d = require("./package.json").dependencies || {};
            const bad = Object.entries(d).filter(([, v]) => /^(file|link|git|github):|\//.test(v));
            if (bad.length) { console.error("unpublishable dependencies:", bad); process.exit(1); }'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: No internal references
        env:
          SCAN_PATTERNS: ${{ secrets.SCAN_PATTERNS }}
        run: |
          printf '%s\n' "$SCAN_PATTERNS" > "$RUNNER_TEMP/scan-patterns.txt"
          CEXY_SCAN_PATTERNS_FILE="$RUNNER_TEMP/scan-patterns.txt" python3 tools/scan_internal.py .
      - name: Secret scan (gitleaks 8.21.2, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --no-banner --redact
      - run: npm run build
      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          TARBALL=$(npm pack --pack-destination "$RUNNER_TEMP/pkg" | tail -n 1)
          if node -p "require('./package.json').version" | grep -q -- '-'; then TAG=next; else TAG=latest; fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$TAG" >> "$GITHUB_OUTPUT"
          # Printed so a manually published tarball can be checked against what CI built
          # (the artifact digest covers the zip, not the tgz).
          (cd "$RUNNER_TEMP/pkg" && sha256sum *.tgz | sed 's/^/tarball sha256 /')
      - name: The packed tarball works as users get it (empty project, no dev dependencies)
        run: node ci/consumer/check.mjs "$RUNNER_TEMP/pkg/${{ steps.pack.outputs.tarball }}"
      - name: Dry-run the publish command (same command, same directory as the publish job; no upload)
        working-directory: ${{ github.workspace }}
        env:
          DIST_TAG: ${{ steps.pack.outputs.dist_tag }}
        run: |
          mkdir -p pkg && cp "$RUNNER_TEMP"/pkg/*.tgz pkg/
          # shellcheck disable=SC2086
          npx -y "$NPM_CLI" publish $PUBLISH_ARGS --tag "$DIST_TAG" --provenance=false --dry-run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: npm-package, path: pkg}
      - name: Publish (prerelease versions go to the "next" dist-tag)
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          # shellcheck disable=SC2086
          npx -y "$NPM_CLI" publish $PUBLISH_ARGS --tag "$DIST_TAG" --provenance
