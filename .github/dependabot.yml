version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      actions: {patterns: ["*"]}
    commit-message: {prefix: "ci"}
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # Majors held back on purpose (see the dev-tools PR that added this):
    #   typescript 7: outside the peer range of typescript-eslint.
    #   @types/node: tracks the lowest supported Node (engines >=22), not the newest.
    ignore:
      # The SDK is bumped deliberately together with an MCP release (exact pin), not by Dependabot.
      - dependency-name: "@cexyio/cexy"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tools:
        dependency-type: development
    commit-message: {prefix: "deps"}
